# W1-5: DINOv2-B at 252 px (18x18 patch tokens, input /14) vs exp-0007 at 224.
# Single-variable change: image_size only.
exp_name: dinov2_b_252
backbone: dinov2_b
pretrained: true
image_size: 252                  # 252 = 18*14
emb_dim: 512
margin: 0.30
scale: 30.0
gem_p: 3.0

epochs: 30
p: 16
k: 4
lr: 3.0e-4
backbone_lr_scale: 0.10
weight_decay: 0.02
warmup_epochs: 3
label_smoothing: 0.10
amp: bf16
ema: true
ema_decay: 0.999
ema_start: 3
num_workers: 12
device: cuda
seed: 42

val_fraction: 0.20
open_set_fraction: 0.20
eval_every: 2
draft_factor: 1.2
cache_size: 320
