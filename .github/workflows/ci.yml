name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Tests (pytest)
        run: pytest tests -q

      - name: Weight gate (< 2 GiB, submission only)
        # --git counts exactly what the checkout ships (weights + code);
        # ignored dev checkpoints under runs/ are not part of the submission.
        run: python tools/weight_gate.py --dir . --git
