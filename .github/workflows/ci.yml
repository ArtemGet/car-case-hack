name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # CPU-only torch wheels. A plain `pip install -r requirements-ci.txt`
      # would otherwise pull the default (CUDA) torch from PyPI — hundreds of MB
      # larger than the tests need. `==2.6.0` accepts the installed 2.6.0+cpu.
      - name: Install CPU PyTorch (CPU wheel index)
        run: >-
          python -m pip install --index-url https://download.pytorch.org/whl/cpu
          torch==2.6.0 torchvision==0.21.0

      - name: Install CI dependencies (CPU-only lock)
        run: python -m pip install -r requirements-ci.txt

      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: python -m ruff check .

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Weight gate (< 2 GiB, baked weights only)
        run: python tools/weight_gate.py --include-dir artifacts
