# Прод-раздача собранного SPA. Подключается devops в docker-compose:
#   web:
#     volumes: ["./web/dist:/usr/share/nginx/html:ro", "./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
# (текущий compose монтирует ./web и отдаёт как статику — заменить на dist после сборки).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Все API-запросы — на сервис api (docker-compose network).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        client_max_body_size 25m;
    }

    # Health-эндпоинт живёт в корне сервиса.
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
